name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Public API endpoint, baked into the web client at build time
      # (guarded in apps/web/next.config.ts). Kept here so CI builds the
      # exact artifact production ships.
      NEXT_PUBLIC_API_URL: https://easyshop-api.easyshop-api.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build
