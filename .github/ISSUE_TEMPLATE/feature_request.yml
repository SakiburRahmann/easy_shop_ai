name: Feature request
description: Propose a new feature or improvement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
      description: What user problem does this solve? (Which user story does it serve?)
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should be built? Keep it at the level of behavior, not implementation.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - MVP (must do now)
        - Stretch (if time allows)
        - Future work (roadmap only)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
